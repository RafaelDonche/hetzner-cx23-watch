name: Disponibilidade do CX23

on:
  schedule:
    # A cada 10 minutos. O GitHub pode atrasar execuções agendadas em horário de pico.
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      testar_aviso:
        description: 'Mandar um aviso de teste para o celular'
        type: boolean
        default: false

permissions:
  # Para gravar o estado.txt quando a disponibilidade muda (e só nessa hora).
  contents: write

concurrency:
  group: verificar
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - id: verificar
        run: bash verificar.sh
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TESTAR_AVISO: ${{ inputs.testar_aviso || 'false' }}

      - if: steps.verificar.outputs.mudou == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add estado.txt
          git commit -m "Disponibilidade mudou: $(cat estado.txt || true)"
          git push
