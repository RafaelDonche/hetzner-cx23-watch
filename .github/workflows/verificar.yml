name: Disponibilidade do CX23

# Só roda pelo relógio ou por quem tem escrita no repositório. Não há gatilho de pull request: um
# fork nunca executa este workflow com os segredos.
on:
  schedule:
    # A cada 5 minutos, o mínimo do GitHub. Ele pode atrasar execuções agendadas em horário de pico.
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      testar_aviso:
        description: 'Mandar um aviso de teste para o celular'
        type: boolean
        default: false
      testar_criacao:
        description: 'Conferir tudo que a criação automática precisa, sem criar nada'
        type: boolean
        default: false

permissions:
  # Gravar o estado.txt quando a disponibilidade muda (e só nessa hora).
  contents: write
  # Desligar o próprio workflow depois de criar a máquina.
  actions: write

concurrency:
  group: verificar
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      # Criação automática: liga só depois de trocar o HCLOUD_TOKEN por um token "Read & Write" e
      # de o teste da criação (testar_criacao) passar. Com token só de leitura, falharia.
      CRIAR: 'false'
      LOCAIS_PARA_CRIAR: 'hel1'
    steps:
      # Fixado pelo SHA (v4), não pela tag: uma tag pode ser movida para outro código.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - id: verificar
        run: bash verificar.sh
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TESTAR_AVISO: ${{ inputs.testar_aviso || 'false' }}
          TESTAR_CRIACAO: ${{ inputs.testar_criacao || 'false' }}

      - if: always() && steps.verificar.outputs.mudou == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add estado.txt
          git commit -m "Disponibilidade mudou: $(cat estado.txt || true)"
          git push

      - if: always() && steps.verificar.outputs.criada == 'true'
        run: gh workflow disable verificar.yml --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
